name: Apply Affiliates to Existing Articles
on:
  workflow_dispatch:

jobs:
  update-articles:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Script
        run: node scripts/apply-affiliates.mjs

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-inject affiliates into existing articles" && git push)
