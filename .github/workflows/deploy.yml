name: Auto Generate and Deploy

on:
  schedule:
    - cron: '0 23 * * *' # 毎日朝8時に実行
  workflow_dispatch: # 手動実行ボタンを表示
  push:
    branches:
      - main # mainにプッシュされたら実行

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: パッケージのインストール
        run: npm install

      # APIキーを使って記事とサーベイの自動生成
      - name: Gemini APIでコンテンツ生成
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-article.mjs

      # 生成された記事をGitに保存
      - name: 生成された記事をコミットして保存
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add content/posts/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-generate new article with survey"
          git push

      # 静的HTMLのビルド
      - name: Next.jsでビルド
        run: npm run build

      # Xserverへアップロード
      - name: Xserverへ自動デプロイ
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: re-skill0.com/public_html/
          local-dir: ./out/