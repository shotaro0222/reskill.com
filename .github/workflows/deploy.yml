name: Auto Generate and Deploy

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: パッケージのインストール
        run: npm install

      - name: Gemini APIでコンテンツ生成
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-article.mjs

      - name: 生成された記事をコミットして保存
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add content/posts/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-generate new article"
          git push

      - name: Next.jsでビルド
        run: npm run build

      # ▼ 手作業をやめ、専用のアクションに鍵のセットアップを丸投げします
      - name: SSHキーのセットアップ
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: known_hostsの追加（Xserverを信頼リストに登録）
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          ssh-keyscan -p 10022 $FTP_HOST >> ~/.ssh/known_hosts

      - name: rsyncでXserverへデプロイ
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
        run: |
          rsync -avz --delete -e "ssh -p 10022" ./out/ $FTP_USER@$FTP_HOST:~/re-skill0.com/public_html/