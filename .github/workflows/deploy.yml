name: Auto Generate and Deploy

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: パッケージのインストール
        run: npm install

      - name: Gemini APIでコンテンツ生成
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-article.mjs

      - name: 生成された記事をコミットして保存
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add content/posts/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-generate new article"
          git push

      - name: Next.jsでビルド
        run: npm run build

      - name: SSHキーのセットアップ
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # XserverのSSHポート(10022)を信頼リストに追加
          ssh-keyscan -p 10022 $FTP_HOST >> ~/.ssh/known_hosts

      - name: rsyncでXserverへデプロイ
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
        run: |
          # rsyncを使って、古いファイルを削除(--delete)しつつ、安全に差分転送します
          # XserverのSSHは /home/ユーザー名/ がルート(~)になります
          rsync -avz --delete -e "ssh -p 10022" ./out/ $FTP_USER@$FTP_HOST:~/re-skill0.com/public_html/