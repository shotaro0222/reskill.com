name: Auto Generate and Deploy

on:
  schedule:
    # 3日に1回、日本時間の朝8時（UTC23時）に実行
    - cron: '0 23 */3 * *'
  workflow_dispatch:
    inputs:
      burst:
        description: '50記事一括生成を実行'
        required: false
        default: 'false'
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: パッケージのインストール
        run: npm install

      # ★ 超重要追加：AIが記事を書く前に、Xserverから最新の画像リストをダウンロードする
      - name: サーバーから最新の画像リストを取得
        run: |
          mkdir -p src/data
          curl -f -s https://re-skill0.com/src/data/media.json -o src/data/media.json || echo "[]" > src/data/media.json

      - name: Gemini APIでコンテンツ生成
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IS_BURST: ${{ github.event.inputs.burst }} 
        run: node scripts/generate-article.mjs

      - name: 生成された記事と画像リストをコミットして保存
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          mkdir -p content/posts
          
          # ★ 変更：media.json も変更があれば一緒にコミットしてGitの記憶を更新する
          git add content/posts/ src/data/media.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-generate new article and sync media.json"
            git pull origin main --rebase
            git push
          else
            echo "追加された記事や画像の変更がないため、コミットをスキップしました"
          fi

      # ★ 追加：ビルド前にランキングデータを生成する
      - name: ランキングデータの生成
        run: node scripts/generate-ranking.mjs

      - name: Next.jsでビルド
        run: npm run build

      - name: SSH鍵のセットアップと高速デプロイ
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
        run: |
          # 1. 鍵の配置
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 2. Next.jsのビルド結果を1つの圧縮ファイルにまとめる
          tar -czf deploy.tar.gz -C out .
          
          # 3. 圧縮ファイルをXserverのホームディレクトリに送信
          scp -P 10022 -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa deploy.tar.gz $FTP_USER@$FTP_HOST:~/
          
          # 4. サーバー側（Xserver）に入って解凍し、サーバー内部でrsyncを実行する
          ssh -p 10022 -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $FTP_USER@$FTP_HOST << 'EOF'
            # 一時ディレクトリを作成して解凍
            mkdir -p ~/temp_deploy
            tar -xzf ~/deploy.tar.gz -C ~/temp_deploy
            
            # サーバー内部でのrsync
            # ★ 修正：消えては困るファイル群（.htaccess, admin, 画像フォルダ）を除外
            rsync -av --delete \
              --exclude="upload-api.php" \
              --exclude="uploads/" \
              --exclude="src/" \
              --exclude=".htaccess" \
              --exclude="admin/" \
              --exclude="Photo/" \
              --exclude="photo/" \
              ~/temp_deploy/ ~/re-skill0.com/public_html/
              
            # 展開が終わったら作業用のゴミ箱を空にする
            rm -rf ~/temp_deploy ~/deploy.tar.gz
          EOF
